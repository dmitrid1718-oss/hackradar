name: Refresh public cyber feeds
on:
  push:
    branches: [main]
    paths:
      - scripts/collect.py
      - .github/workflows/refresh.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hackradar-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collector syntax
        run: python -m py_compile scripts/collect.py
      - name: Collect source-backed observations and append history
        run: python scripts/collect.py
      - name: Commit observed feed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified cyber observations and history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Summarize publication
        if: success()
        run: |
          echo "### HackRadar data refresh succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "Both current observations and timestamped history were saved to the main branch." >> "$GITHUB_STEP_SUMMARY"
