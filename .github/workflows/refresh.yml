name: Refresh public cyber feeds
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hackradar-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public-source data
        run: python scripts/collect.py
      - name: Commit updated feed
        run: |
          git config user.name "hackradar-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public cyber observations"
            git push
          fi
